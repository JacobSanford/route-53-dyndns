# Set ROUTE53_DOMAIN_A_RECORD below, and put the AWS keys in a .env file beside this one.
# See README.md for the other variables.
services:
  route53-dyndns:
    image: ghcr.io/jacobsanford/route53-dyndns:2.x
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      ROUTE53_DOMAIN_A_RECORD: home.example.com
